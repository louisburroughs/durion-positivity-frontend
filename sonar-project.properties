# SonarQube / SonarCloud configuration
#
# Issue suppressions ("won't fix") recorded in version control. See issue #120.
#
# NOTE: if this project is analysed via SonarCloud *Automatic Analysis*, the
# presence of this file does not apply these exclusions on its own — Automatic
# Analysis ignores sonar-project.properties. In that case, mirror the same
# rule/path exclusions under Project Settings → Analysis Scope, or switch to a
# CI-based scan (sonar-scanner) which honours this file. With a CI-based scan
# these exclusions take effect as written.

# --- Won't fix: intentional WAI-ARIA 1.2 combobox pattern (issue #120) ---
#
# The workexec typeahead/search controls implement the full active-descendant
# ARIA combobox pattern: role="combobox" input + role="listbox" host +
# role="option" rows, with aria-activedescendant / aria-expanded / aria-selected
# and keyboard navigation. Sonar's Web:S6842 (non-interactive element with an
# interactive role) and Web:S6819 (prefer native tag over role) would push this
# toward native <select>/<datalist>, which cannot render the multi-line options,
# the active highlight, or the loading/empty/error states — a net accessibility
# and UX regression. The ARIA pattern is the accessible choice; kept as-is.
sonar.issue.ignore.multicriteria=cb1,cb2,cb3,cb4,cb5,cb6,cb7,cb8,cb9,cb10

# search-typeahead component (listbox/option + status <li>)
sonar.issue.ignore.multicriteria.cb1.ruleKey=Web:S6842
sonar.issue.ignore.multicriteria.cb1.resourceKey=**/workexec-search-typeahead.component.html
sonar.issue.ignore.multicriteria.cb2.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.cb2.resourceKey=**/workexec-search-typeahead.component.html

