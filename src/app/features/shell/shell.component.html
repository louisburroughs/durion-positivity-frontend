<div class="shell-root">
  <a class="skip-link" href="#main-content" (click)="skipToMainContent($event)">{{ 'SHELL.SKIP_TO_CONTENT' | translate
    }}</a>

  <!-- Top bar -->
  <app-shell-header (navToggle)="toggleNav()" [navCollapsed]="navCollapsed()" [navId]="NAV_ID" />

  <!-- Body: sidebar + main column -->
  <div class="shell-body">

    <!-- Left navigation -->
    <app-shell-nav [collapsed]="navCollapsed()" [navId]="NAV_ID" />

    <!-- Mobile overlay when nav is open -->
    @if (!navCollapsed()) {
    <button type="button" class="nav-overlay" tabindex="-1" (click)="toggleNav()" (keydown.escape)="toggleNav()"
      [attr.aria-label]="'SHELL.HEADER.NAV_OVERLAY_CLOSE' | translate"></button>
    }

    <!-- Main column -->
    <main id="main-content" #mainContent class="shell-main" role="main" tabindex="-1">

      <!-- Top frame: Chat panel (fixed-height, resize from bottom edge) -->
      <div class="frame-chat">
        <app-chat-panel />
      </div>

      <!-- Bottom frame: Content / routed page -->
      <div class="frame-content">
        <app-content-panel />
      </div>

    </main>

  </div>

  <!-- Footer -->
  <app-shell-footer />

</div>
