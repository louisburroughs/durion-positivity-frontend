<section class="chat-panel" [attr.aria-label]="'SHELL.CHAT.PANEL_ARIA' | translate">

  <!-- Collapse control -->
  <button type="button" class="chat-close-btn" (click)="close.emit()"
    [attr.aria-label]="'SHELL.CHAT.CLOSE_ARIA' | translate" [title]="'SHELL.CHAT.CLOSE_ARIA' | translate">
    <span class="material-symbols-rounded" aria-hidden="true">close</span>
  </button>

  <!-- Message list -->
  <div class="message-list" #messageList role="log" aria-live="polite"
    [attr.aria-label]="'SHELL.CHAT.MESSAGES_ARIA' | translate">
    @if (isEmpty()) {
    <div class="empty-state">
      <p class="empty-icon" aria-hidden="true">💬</p>
      <p>
        <strong>{{ 'SHELL.CHAT.EMPTY_HEADING' | translate }}</strong>
        {{ 'SHELL.CHAT.EMPTY_BODY' | translate }}
      </p>
    </div>
    } @else {
    @for (msg of messages(); track msg.id) {
    <div class="message" [class.message--user]="msg.sender === 'user'" [class.message--system]="msg.sender === 'system'"
      [attr.aria-label]="(msg.sender === 'user' ? ('SHELL.CHAT.SENDER_USER' | translate) : ('SHELL.CHAT.SENDER_SYSTEM' | translate)) + ': ' + msg.content">
      <div class="bubble">{{ msg.content }}</div>
      <time class="timestamp" [dateTime]="msg.timestamp.toISOString()" [title]="msg.timestamp | date:'medium'">
        {{ msg.timestamp | date:'HH:mm' }}
      </time>
    </div>
    }

    @if (sending()) {
    <div class="message message--system typing-indicator" [attr.aria-label]="'SHELL.CHAT.TYPING_ARIA' | translate">
      <div class="bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
    }
    }
  </div>

  <!-- Input row -->
  <div class="chat-input-row">
    <textarea class="chat-input" rows="1" [placeholder]="'SHELL.CHAT.INPUT_PLACEHOLDER' | translate"
      [value]="inputValue()" (input)="inputValue.set($any($event.target).value)" (keydown)="onKeyDown($event)"
      [disabled]="sending()" [attr.aria-label]="'SHELL.CHAT.INPUT_ARIA' | translate"></textarea>
    <button class="send-btn" type="button" (click)="sendMessage()" [disabled]="!inputValue().trim() || sending()"
      [attr.aria-label]="'SHELL.CHAT.SEND_ARIA' | translate" [title]="'SHELL.CHAT.SEND_TITLE' | translate">
      ➤
    </button>
    @if (isAdmin()) {
    <button class="rag-ingest-btn" type="button"
            (click)="showRagDialog.set(true)"
            [attr.aria-label]="'SHELL.RAG.BUTTON_ARIA' | translate"
            [title]="'SHELL.RAG.BUTTON_TITLE' | translate">
      📄
    </button>
    }
  </div>

  @if (showRagDialog()) {
  <app-rag-ingest-dialog (closed)="showRagDialog.set(false)" />
  }

</section>
