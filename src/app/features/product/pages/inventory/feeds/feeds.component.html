<main class="page" aria-labelledby="feeds-title">
  <header class="page-header">
    <h1 id="feeds-title" class="page-title">{{ 'PRODUCT.INVENTORY.FEEDS.TITLE' | translate }}</h1>
  </header>

  <section class="card tabs" aria-label="{{ 'PRODUCT.INVENTORY.FEEDS.TABS.ARIA' | translate }}">
    <button class="tab-btn" type="button" [class.tab-btn--active]="activeTab() === 'MFR'"
      (click)="activeTab.set('MFR'); sku().trim() && search()">
      {{ 'PRODUCT.INVENTORY.FEEDS.TABS.MANUFACTURER' | translate }}
    </button>
    <button class="tab-btn" type="button" [class.tab-btn--active]="activeTab() === 'DISTRIBUTOR'"
      (click)="activeTab.set('DISTRIBUTOR'); sku().trim() && search()">
      {{ 'PRODUCT.INVENTORY.FEEDS.TABS.DISTRIBUTOR' | translate }}
    </button>
  </section>

  <section class="card panel">
    <div class="search-grid">
      <label>
        {{ 'PRODUCT.INVENTORY.FEEDS.SKU' | translate }}
        <input class="input-underline" type="search" [value]="sku()"
          [attr.placeholder]="'PRODUCT.INVENTORY.FEEDS.SKU_PLACEHOLDER' | translate"
          (input)="sku.set($event.target.value)" />
      </label>
      <button class="btn-primary" type="button" (click)="search()">{{ 'COMMON.SEARCH' | translate }}</button>
    </div>
  </section>

  @if (state() === 'idle') {
  <section class="card panel state-card">
    <p>{{ 'PRODUCT.INVENTORY.FEEDS.STATE.EMPTY' | translate }}</p>
  </section>
  }

  @if (state() === 'unavailable') {
  <section class="card panel state-card" role="status">
    <p>{{ 'PRODUCT.INVENTORY.FEEDS.STATE.UNAVAILABLE' | translate }}</p>
  </section>
  }
</main>
