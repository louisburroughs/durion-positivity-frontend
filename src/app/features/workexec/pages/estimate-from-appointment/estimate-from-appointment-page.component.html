<section>
  <header class="page-header">
    <h1>{{ 'WORKEXEC.ESTIMATE_FROM_APPT.TITLE' | translate }}</h1>
  </header>

  <form class="estimate-form" [formGroup]="estimateForm" (ngSubmit)="submit()">
    <div class="form-group">
      <label>{{ 'WORKEXEC.ESTIMATE_FROM_APPT.APPOINTMENT_ID' | translate }} <input type="text" formControlName="appointmentId" /></label>
    </div>
    <div class="form-group">
      <label>{{ 'WORKEXEC.ESTIMATE_FROM_APPT.WORKORDER_ID' | translate }} <input type="text" formControlName="workorderId" /></label>
    </div>
    <div class="form-group">
      <label>{{ 'WORKEXEC.ESTIMATE_FROM_APPT.NOTES' | translate }} <textarea formControlName="notes"></textarea></label>
    </div>

    <button class="submit-btn" type="submit"
      [disabled]="estimateForm.controls.appointmentId.value.trim().length === 0 || loading()">{{ 'WORKEXEC.ESTIMATE_FROM_APPT.CREATE' | translate }}</button>
  </form>

  <p class="success-banner" *ngIf="createSuccess()">{{ 'WORKEXEC.ESTIMATE_FROM_APPT.SUCCESS' | translate }}</p>
  <p class="error-banner" *ngIf="createError()">{{ createError() }}</p>
</section>
