<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../preview.css">
<script>const theme = new URLSearchParams(location.search).get('theme'); if (theme) document.documentElement.dataset.theme = theme;</script>
<title>Icon</title>
<style>
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .stack { display: flex; flex-direction: column; gap: var(--space-3); }
</style>
</head>
<body>
<div class="row" style="gap:var(--space-5)">
  <span class="material-symbols-rounded" aria-hidden="true">build</span>
  <span class="material-symbols-rounded" aria-hidden="true">directions_car</span>
  <span class="material-symbols-rounded" aria-hidden="true">tire_repair</span>
  <span class="material-symbols-rounded" aria-hidden="true">garage</span>
  <span class="material-symbols-rounded" aria-hidden="true">receipt_long</span>
  <span class="material-symbols-rounded" aria-hidden="true">inventory_2</span>
  <span class="material-symbols-rounded" aria-hidden="true">calendar_month</span>
  <span class="material-symbols-rounded" aria-hidden="true">account_balance</span>
  <span class="material-symbols-rounded" aria-hidden="true" style="color:var(--accentA400)">verified</span>
  <span class="material-symbols-rounded" aria-hidden="true" style="color:var(--goldA400)">workspace_premium</span>
</div>
<div class="row" style="margin-top:var(--space-4)">
  <button type="button" class="btn btn--outline btn--sm"><span class="material-symbols-rounded" aria-hidden="true">print</span>Print estimate</button>
  <button type="button" class="btn btn--ghost btn--sm" aria-label="Edit customer"><span class="material-symbols-rounded" aria-hidden="true">edit</span></button>
</div>
</body>
</html>
