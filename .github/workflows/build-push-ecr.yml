name: Build and Push to ECR

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/**"
      - "package*.json"
      - "angular.json"
      - "tsconfig*.json"
      - "Dockerfile"
      - ".github/workflows/build-push-ecr.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment tag prefix"
        required: false
        default: "alpha"
      deploy_alpha:
        description: "Deploy to alpha EC2 after pushing image (defaults to enabled for alpha builds)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ecr-push-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPO: durion/durion-positivity-frontend
  IMAGE_TAG: sha-${{ github.sha != '' && github.sha || 'local' }}

jobs:
  build-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="sha-${SHORT_SHA}"
          FULL_IMAGE="${REGISTRY}/${{ env.ECR_REPO }}:${IMAGE_TAG}"
          LATEST_IMAGE="${REGISTRY}/${{ env.ECR_REPO }}:latest"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${LATEST_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${FULL_IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ steps.meta.outputs.latest_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Write image tag to job summary
        run: |
          echo "## Frontend Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | \`${{ env.ECR_REPO }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${{ steps.meta.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Full image | \`${{ steps.meta.outputs.full_image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this tag as **FRONTEND_TAG** in \`docker-compose.prod.yml\` for deployment." >> "$GITHUB_STEP_SUMMARY"

  deploy-alpha:
    name: Deploy Frontend to Alpha
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: >
      success() &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.deploy_alpha || inputs.environment == 'alpha')) ||
        vars.AUTO_DEPLOY_ALPHA == 'true'
      )

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend service via AWS SSM Run Command
        env:
          ALPHA_INSTANCE_ID: ${{ secrets.ALPHA_EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${ALPHA_INSTANCE_ID}" ]; then
            echo "Missing required secret: ALPHA_EC2_INSTANCE_ID"
            exit 1
          fi

          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          COMMAND_SCRIPT=$(cat <<EOF
          set -euo pipefail
          ALPHA_ROOT="/opt/durion/alpha"
          BACKEND_DIR="\${ALPHA_ROOT}/backend"
          ENV_FILE="\${ALPHA_ROOT}/.env"
          PROD_OVERRIDE="\${ALPHA_ROOT}/docker-compose.prod.yml"
          IMAGE_TAG="${IMAGE_TAG}"

          if grep -q '^FRONTEND_TAG=' "\${ENV_FILE}"; then
            sed -i "s/^FRONTEND_TAG=.*/FRONTEND_TAG=\${IMAGE_TAG}/" "\${ENV_FILE}"
          else
            printf '\nFRONTEND_TAG=%s\n' "\${IMAGE_TAG}" >> "\${ENV_FILE}"
          fi

          cd "\${BACKEND_DIR}"

          docker compose \
            -f docker-compose.yml \
            -f "\${PROD_OVERRIDE}" \
            --env-file "\${ENV_FILE}" \
            pull pos-frontend

          docker compose \
            -f docker-compose.yml \
            -f "\${PROD_OVERRIDE}" \
            --env-file "\${ENV_FILE}" \
            up -d --force-recreate pos-frontend

          docker compose \
            -f docker-compose.yml \
            -f "\${PROD_OVERRIDE}" \
            --env-file "\${ENV_FILE}" \
            ps pos-frontend
          EOF
          )

          COMMAND_PARAMETERS=$(printf '%s\n' "${COMMAND_SCRIPT}" | python3 -c 'import json, sys; print(json.dumps({"commands": sys.stdin.read().splitlines()}))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${ALPHA_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy frontend image ${IMAGE_TAG} from GitHub Actions" \
            --parameters "${COMMAND_PARAMETERS}" \
            --query "Command.CommandId" \
            --output text)

          echo "Issued SSM command: ${COMMAND_ID}"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${ALPHA_INSTANCE_ID}" \
              --query "Status" \
              --output text)
            echo "[$i/60] Status: ${STATUS}"
            if [[ "${STATUS}" == "Success" ]]; then
              break
            fi
            if [[ "${STATUS}" == "Failed" || "${STATUS}" == "Cancelled" || "${STATUS}" == "TimedOut" ]]; then
              break
            fi
            sleep 15
          done

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${ALPHA_INSTANCE_ID}" \
            --query "Status" \
            --output text)

          echo "SSM command status: ${STATUS}"
          echo "---- Begin SSM Standard Output ----"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${ALPHA_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text
          echo "---- End SSM Standard Output ----"
          echo "---- Begin SSM Standard Error ----"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${ALPHA_INSTANCE_ID}" \
            --query "StandardErrorContent" \
            --output text
          echo "---- End SSM Standard Error ----"

          if [ "${STATUS}" != "Success" ]; then
            echo "SSM deploy failed with status: ${STATUS}"
            exit 1
          fi
