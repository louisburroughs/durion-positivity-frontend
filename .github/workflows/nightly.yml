# Nightly security scan + SonarCloud analysis, mirroring the backend's
# `security-scan` and `code-quality-full` jobs (durion-positivity-backend
# .github/workflows/ci.yml). Kept out of the PR path: the Dependency-Check NVD
# sync and a full coverage run are too slow for every push.
name: Nightly Security & Quality

on:
  schedule:
    - cron: "0 5 * * *" # same slot as the backend nightly
  workflow_dispatch:

# Job-level permissions only (Sonar githubactions:S8264); jobs without a
# permissions block get no token scopes.
permissions: {}

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by digest: a retagged or compromised Docker Hub tag must not change
  # what this security job executes. Tag kept for readability: 13.0.0.
  DEPENDENCY_CHECK_IMAGE: "owasp/dependency-check@sha256:0e8f69ad5b00d62000937f4e57189812343f6903d9c83ee712012d51542a020a"

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Get current week for cache key
        id: date
        run: echo "week=$(date +'%Y-%W')" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP NVD data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.dependency-check/data
          # NVD data is time-sensitive, not lockfile-sensitive: bust weekly.
          key: ${{ runner.os }}-owasp-nvd-${{ steps.date.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-owasp-nvd-

      - name: Run OWASP Dependency Check
        # Same datafeed mirror as the backend (the NVD API is unusably slow even
        # with a key). Scans package-lock.json with the Node Package and Node Audit
        # analyzers, skipping devDependencies: like the backend's compile/runtime
        # scope, only what ships in the browser bundle or the SSR server gates.
        # OSS Index needs credentials we don't have; yarn/pnpm aren't used here.
        # Fails on CVSS >= 7; suppressions live in security/dependency-check-suppressions.xml.
        run: |
          mkdir -p "$HOME/.dependency-check/data" reports/dependency-check
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/src:ro \
            -v "$HOME/.dependency-check/data":/usr/share/dependency-check/data \
            -v "$GITHUB_WORKSPACE/reports/dependency-check":/report \
            "$DEPENDENCY_CHECK_IMAGE" \
            --scan /src/package-lock.json \
            --project durion-positivity-frontend \
            --nvdDatafeed "https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz" \
            --disableOssIndex --disableYarnAudit --disablePnpmAudit \
            --nodeAuditSkipDevDependencies --nodePackageSkipDevDependencies \
            --suppression /src/security/dependency-check-suppressions.xml \
            --format HTML --format JSON \
            --out /report \
            --failOnCVSS 7

      - name: npm audit (production dependencies)
        # Second opinion straight from the GitHub advisory database; fails on
        # high/critical advisories in shipped dependencies.
        if: always()
        run: npm audit --omit=dev --audit-level=high

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: reports/dependency-check/**
          if-no-files-found: ignore
          retention-days: 30

  sonarcloud:
    name: Full Coverage SonarCloud Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # SONAR_TOKEN is deliberately NOT a job-level env: npm ci, sdk:install,
    # Playwright and the test suite all run lifecycle scripts / repository code
    # that could read it. It is handed only to the presence check and the scan.

    steps:
      - name: Require the SonarCloud token
        # A missing secret must fail the nightly, not skip the analysis and go green.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is not set; the nightly SonarCloud analysis cannot run."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Sonar needs history for blame / new-code detection
          persist-credentials: false

      - name: Checkout Angular SDK repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: louisburroughs/durion-positivity-sdk-angular
          path: .sdk-src
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Angular SDK packages
        run: npm run sdk:install

      - name: Install Playwright Chromium (Vitest browser-mode runner)
        run: npx playwright install --with-deps chromium

      - name: Unit tests with coverage
        # Coverage options (include/exclude, lcov reporter, ratchet floors) live in
        # angular.json test.options and only take effect with --coverage. The step
        # continues on failure so SonarCloud still receives the report; the final
        # step fails the job, like the backend's --fail-at-end.
        id: tests
        continue-on-error: true
        run: npx ng test --no-watch --browsers=ChromiumHeadless --runner-config vitest.config.ts --coverage

      - name: SonarCloud Scan
        # Project key, organization, sources and the lcov path come from
        # sonar-project.properties. The token is scoped to this step only.
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if tests or the coverage ratchet failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed or coverage fell below the angular.json coverageThresholds floors; see the 'Unit tests with coverage' step."
          exit 1
